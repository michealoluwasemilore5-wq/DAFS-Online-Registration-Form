<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirming Payment | DAFS</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .payment-result{max-width:700px;margin:80px auto;padding:32px;background:#fff;border-radius:20px;box-shadow:0 10px 35px rgba(0,0,0,.1);text-align:center}
    .payment-result h1{margin:0 0 12px}.payment-result p{line-height:1.6}.payment-result .spinner{width:42px;height:42px;border:4px solid #ddd;border-top-color:#111;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
    .payment-result a{display:inline-block;margin-top:18px;padding:12px 20px;border-radius:10px;text-decoration:none}
    .ref{font-family:monospace;word-break:break-all}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="payment-result">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Verifying your ₦1,000 payment…</h1>
    <p id="message">Please wait. Your registration will only be submitted after Paystack confirms the payment.</p>
    <div id="details"></div>
  </main>
<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const reference = params.get('reference') || params.get('trxref');
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const spinner = document.getElementById('spinner');
  const details = document.getElementById('details');

  if (!reference) {
    spinner.style.display = 'none';
    title.textContent = 'Payment reference not found';
    message.textContent = 'Your registration has NOT been submitted. If you completed payment, please contact the school and provide your Paystack receipt.';
    details.innerHTML = '<a href="/">Return to registration</a>';
    return;
  }

  try {
    const response = await fetch('/api/paystack/complete/' + encodeURIComponent(reference));
    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || 'Payment could not be verified.');
    }

    spinner.style.display = 'none';
    title.textContent = 'Payment Successful — Registration Submitted';
    message.textContent = 'Your ₦1,000 payment has been verified by Paystack and your registration has now been submitted.';
    details.innerHTML =
      '<p><strong>Application ID:</strong> ' + escapeHtml(result.applicationId || '—') + '</p>' +
      '<p><strong>Payment Reference:</strong> <span class="ref">' + escapeHtml(reference) + '</span></p>' +
      '<a href="/">Return to the DAFS website</a>';
  } catch (err) {
    spinner.style.display = 'none';
    title.textContent = 'Registration Not Submitted';
    message.textContent = err.message || 'We could not verify the payment. Your registration has not been submitted.';
    details.innerHTML =
      '<p><strong>Payment Reference:</strong> <span class="ref">' + escapeHtml(reference) + '</span></p>' +
      '<p>Please keep your Paystack receipt and contact the school if money was deducted.</p>' +
      '<a href="/">Return to registration</a>';
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, char => ({
      '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
    }[char]));
  }
})();
</script>
</body>
</html>
